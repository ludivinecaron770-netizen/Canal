<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Niveau Canal</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #eef6f8;
    font-family: Arial, sans-serif;
}

.carte {
    background: white;
    padding: 40px 50px;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,.15);
    text-align: center;
}

h1 {
    color: #164b6b;
}

.niveau {
    font-size: 24px;
}

.valeur {
    font-size: 45px;
    font-weight: bold;
    color: #008b9a;
}
</style>
</head>

<body>

<div class="carte">
    <h1>Niveau Canal</h1>
    <div id="niveau">Chargement...</div>
</div>

<script>
async function charger() {

    try {

        const response = await fetch("niveau.json?" + Date.now());

        if (!response.ok)
            throw new Error("niveau.json introuvable");

        const data = await response.json();

        document.getElementById("niveau").innerHTML =
            data.date +
            " : <span class='valeur'>" +
            data.niveau +
            " m</span>";

    } catch (e) {

        document.getElementById("niveau").textContent =
            "Impossible de récupérer le niveau";

        console.error(e);
    }
}

charger();
</script>

</body>
</html>
