<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niveau Canal</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef5f8;
            font-family: Arial, sans-serif;
        }

        .carte {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.15);
            text-align: center;
        }

        h1 {
            color: #164b6b;
        }

        #niveau {
            font-size: 22px;
        }

        .valeur {
            font-size: 45px;
            font-weight: bold;
            color: #087f8c;
        }
    </style>
</head>

<body>

<div class="carte">
    <h1>Niveau Canal</h1>
    <div id="niveau">Chargement...</div>
</div>

<script>

async function afficherNiveau() {

    const url =
        "https://www.vnf.fr/aghyre/api/rsi-data/data" +
        "?dateReference=2026-10-04T09:49:00.000Z" +
        "&limit=30" +
        "&pas=86400" +
        "&pks=id:::L16956" +
        "&rubricMasc=true";

    try {

        const response = await fetch(url, {
            method: "GET",
            credentials: "include",
            headers: {
                "Accept": "application/json"
            }
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        console.log("Données VNF :", data);

        document.getElementById("niveau").innerHTML =
            JSON.stringify(data);

    } catch (error) {

        console.error(error);

        document.getElementById("niveau").innerHTML =
            `<span style="color:red">
                ${error.message}
            </span>`;
    }
}

afficherNiveau();

</script>

</body>
</html>
