<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Niveau Canal</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f6f9;
            font-family: Arial, sans-serif;
        }

        .carte {
            background: white;
            padding: 35px 45px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            margin: 0 0 20px;
            color: #164b6b;
            font-size: 28px;
        }

        #niveau {
            font-size: 24px;
            color: #222;
        }

        .valeur {
            font-size: 42px;
            font-weight: bold;
            color: #087f8c;
        }

        .erreur {
            color: #c62828;
        }
    </style>
</head>

<body>

<div class="carte">
    <h1>Niveau Canal</h1>

    <div id="niveau">
        Chargement...
    </div>
</div>

<script>

async function afficherNiveau() {

    const dateReference = new Date().toISOString();

    const params = new URLSearchParams({
        dateReference: dateReference,
        limit: "30",
        pas: "86400",
        pks: "id:::L16956",
        rubricMasc: "true"
    });

    const url =
        "https://www.vnf.fr/aghyre/api/rsi-data/data?" +
        params.toString();

    try {

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Erreur HTTP " + response.status);
        }

        const data = await response.json();

        console.log("Données VNF :", data);

        /*
         * IMPORTANT :
         * Cette partie devra éventuellement être adaptée
         * selon la structure exacte du JSON retourné par VNF.
         */

        const releve = data[0];

        // Deuxième colonne
        const niveau = releve[1];

        // Date du relevé
        const date = new Date(releve[0]);

        const dateFormatee = date.toLocaleDateString("fr-FR");

        document.getElementById("niveau").innerHTML =
            `Niveau Canal le ${dateFormatee} : ` +
            `<span class="valeur">${niveau} m</span>`;

    } catch (erreur) {

        console.error(erreur);

        document.getElementById("niveau").innerHTML =
            `<span class="erreur">
                Impossible de récupérer le niveau.
            </span>`;
    }
}

afficherNiveau();

</script>

</body>
</html>
