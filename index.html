<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Niveau Canal</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef6f8;
            font-family: Arial, sans-serif;
        }

        .carte {
            background: white;
            padding: 35px 50px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,.15);
            text-align: center;
        }

        h1 {
            color: #164b6b;
            margin: 0 0 20px;
        }

        #niveau {
            font-size: 22px;
        }

        .valeur {
            font-size: 42px;
            font-weight: bold;
            color: #008b9a;
        }

        .erreur {
            color: #c62828;
        }
    </style>
</head>

<body>

<div class="carte">

    <h1>Niveau Canal</h1>

    <div id="niveau">
        Chargement...
    </div>

</div>

<script>

async function afficherNiveau() {

    try {

        const response = await fetch(
            "https://TON-WORKER.workers.dev"
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        document.getElementById("niveau").innerHTML =
            "le " + data.date +
            " : <span class='valeur'>" +
            data.niveau +
            " m</span>";

    } catch (error) {

        console.error(error);

        document.getElementById("niveau").innerHTML =
            "<span class='erreur'>" +
            "Impossible de récupérer le niveau" +
            "</span>";
    }
}

afficherNiveau();

</script>

</body>
</html>
